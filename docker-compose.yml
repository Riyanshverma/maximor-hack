version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tieout
      POSTGRES_PASSWORD: tieout_dev
      POSTGRES_DB: tieout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tieout -d tieout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
